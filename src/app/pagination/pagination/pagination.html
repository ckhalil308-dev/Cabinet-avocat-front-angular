<div class="flex items-center justify-between w-full max-w-2xl mx-auto my-12 px-6 py-4 bg-white rounded-2xl shadow-sm border border-slate-100 reveal">
  
  <button 
    (click)="changerPage(currentPage - 1)"
    [disabled]="currentPage === 0"
    class="group flex items-center space-x-2 px-4 py-2 text-slate-500 hover:text-slate-900 disabled:opacity-20 disabled:cursor-not-allowed transition-all"
  >
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 group-hover:-translate-x-1 transition-transform">
      <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
    </svg>
    <span class="text-[10px] uppercase tracking-[0.2em] font-bold">Précédent</span>
  </button>

  <div class="flex flex-col items-center">
    <div class="flex items-baseline space-x-1">
      <span class="text-2xl font-light text-slate-900">{{ currentPage + 1 }}</span>
      <span class="text-slate-300 text-sm mx-1">sur</span>
      <span class="text-sm font-bold text-slate-400">{{ totalPages }}</span>
    </div>
    <div class="w-12 h-1 bg-amber-500/20 rounded-full mt-1 overflow-hidden">
       <div class="h-full bg-amber-500 transition-all duration-500" [style.width.%]="((currentPage + 1) / totalPages) * 100"></div>
    </div>
  </div>

  <button 
    (click)="changerPage(currentPage + 1)"
    [disabled]="currentPage >= totalPages - 1"
    class="group flex items-center space-x-2 px-4 py-2 text-slate-500 hover:text-slate-900 disabled:opacity-20 disabled:cursor-not-allowed transition-all"
  >
    <span class="text-[10px] uppercase tracking-[0.2em] font-bold">Suivant</span>
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 group-hover:translate-x-1 transition-transform">
      <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
    </svg>
  </button>

</div>
