 <div class="bg-white rounded-3xl border border-slate-100 shadow-sm hover:shadow-md transition-all overflow-hidden flex flex-col md:flex-row">
             
              <div class="p-8 md:w-1/2 border-b md:border-b-0 md:border-r border-slate-50">
                <div class="flex items-center justify-between mb-6">

                  <span class="px-3 py-1 rounded-full text-[9px] font-black uppercase tracking-widest"
                    [ngClass]="{
                      'bg-green-50 text-green-600 border border-green-100': affaire.statut === 'GAGNEE',
                      'bg-red-50 text-red-500 border border-red-100':       affaire.statut === 'PERDUE',
                      'bg-amber-50 text-amber-500 border border-amber-100': affaire.statut === 'EN_COURS'
                    }">
                    ● {{ affaire.statut }}
                  </span>
                   <p ><span class="text-[15px] text-bold font-mono text-slate-500">Num dossier: </span> {{ affaire.numeroDossier }}</p> 
                </div>

                <h3 class="text-2xl font-serif  text-slate-900 mb-4">{{ affaire.titre }}</h3>
                <div class="flex items-center space-x-2 mb-4">
  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4 text-amber-500">
    <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5" />
  </svg>

         <h3 class="text-sm italic text-slate-900">
    {{ affaire.dateOuverture | date:'dd / MM / yyyy' }}
  </h3>
</div>          <div>
                 <p class="text-sm font-bold leading-relaxed mb-3 line-clamp-2 font-serif ">Description: </p>
                 <p class="text-sm text-slate-500 leading-relaxed mb-6 line-clamp-2">
                  {{ affaire.description || 'Aucune description détaillée disponible pour cette affaire.' }}
                </p>
                </div>
