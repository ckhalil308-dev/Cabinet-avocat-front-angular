@if(loading){
    <div class="flex items-center justify-center h-64">
        <svg class="animate-spin h-8 w-8 text-gray-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span class="ml-2 text-gray-500">Chargement...</span>
    </div>

}@else{
   @if (clients.length==0) {
        <p
        >Aucun client trouvé.</p>
   } 

<div class="w-full bg-white border border-slate-200 rounded-sm shadow-sm overflow-hidden reveal">
  <table class="w-full text-left border-collapse">
    <thead class="bg-slate-50 border-b border-slate-200">
      <tr>
        <th class="px-4 py-3 text-[11px] font-bold uppercase tracking-wider text-slate-500">Nom</th>
        <th class="px-4 py-3 text-[11px] font-bold uppercase tracking-wider text-slate-500">Prénom</th>
        <th class="px-4 py-3 text-[11px] font-bold uppercase tracking-wider text-slate-500">Email</th>
        <th class="px-4 py-3 text-[11px] font-bold uppercase tracking-wider text-slate-500">Téléphone</th>
        <th class="px-4 py-3 text-[11px] font-bold uppercase tracking-wider text-slate-500 text-right">Actions</th>
      </tr>
    </thead>
    
    <tbody class="divide-y divide-slate-100">
      @for (item of clients; track item.id) {
          <tr class="hover:bg-slate-50/50 transition-colors">
          <td class="px-4 py-4 text-sm font-semibold text-slate-900">{{ item.nom }}</td>
          <td class="px-4 py-4 text-sm text-slate-700">{{ item.prenom }}</td>
          <td class="px-4 py-4 text-sm text-slate-600 font-mono">{{ item.email }}</td>
          <td class="px-4 py-4 text-sm text-slate-700">
            <span class="bg-slate-100 px-2 py-1 rounded text-xs border border-slate-200">
              {{ item.numTelephone }}
            </span>
          </td>
          <td class="px-4 py-4 text-right">
            <div class="flex justify-end space-x-2">

              <!-- <button  (click)="getClient(item.id)" class="p-1.5 text-slate-400 hover:text-blue-600 hover:bg-blue-50 rounded transition-all">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
                </svg>
              </button>-->

              <button (click)="VerifierClient(item.id)" class="p-1.5 text-slate-400 hover:text-green-600 hover:bg-green-50 rounded transition-all">
             <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
             <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
             </svg>
              </button> 
             
            </div>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
<app-pagination [currentPage]="page" [totalPages]="totalPages" (pageChange)="setPage($event)" ></app-pagination>
}
